<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>外出チェック</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --bg: #0c0c10;
    --surface: #13131a;
    --border: #1f1f2a;
    --text: #e8e4dd;
    --muted: #4a4a5a;
    --accent: #c8f0a0;
    --accent-dim: #1a2e14;
    --warn: #f0c060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  @keyframes flashIn {
    0% { opacity: 0; transform: scale(0.95); }
    40% { opacity: 1; transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes scanFlash {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  .scan-overlay {
    position: fixed;
    inset: 0;
    background: rgba(200, 240, 160, 0.07);
    pointer-events: none;
    z-index: 100;
    animation: scanFlash 1s ease-out forwards;
  }

  .header {
    padding: 32px 24px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .header-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

  .tab-bar { display: flex; gap: 6px; }

  .tab {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--warn);
    color: #0c0c10;
    border-color: var(--warn);
    font-weight: 700;
  }

  .main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    margin: 24px 0 12px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--accent);
    color: #0c0c10;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 30px;
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .progress-wrap { margin: 20px 0 16px; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .count { color: var(--warn); }
  .count.all { color: var(--accent); }

  .progress-bar {
    background: var(--border);
    border-radius: 3px;
    height: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--warn);
    transition: width 0.4s ease, background 0.4s;
  }

  .progress-fill.all { background: var(--accent); }

  .check-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    transition: all 0.2s;
  }

  .check-item.checked {
    background: var(--accent-dim);
    border-color: rgba(200,240,160,0.3);
  }

  .check-item.just-checked { animation: flashIn 0.4s ease-out; }

  .check-icon { font-size: 22px; flex-shrink: 0; }

  .check-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s;
  }

  .check-item.checked .check-label {
    color: var(--accent);
    text-decoration: line-through;
    text-decoration-color: rgba(200,240,160,0.4);
  }

  .nfc-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    background: var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  .check-circle {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .check-item.checked .check-circle {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c0c10;
  }

  .complete-banner {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    margin-top: 16px;
    display: none;
  }

  .complete-banner.show { display: block; }
  .complete-emoji { font-size: 40px; margin-bottom: 10px; }
  .complete-title { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .complete-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

  .btn-reset {
    margin-top: 14px;
    background: transparent;
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
  }

  .url-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .url-icon { font-size: 18px; flex-shrink: 0; }
  .url-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .url-text {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.5;
  }

  .btn-copy {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
    font-family: 'Noto Sans JP', sans-serif;
    transition: background 0.2s;
  }

  .btn-copy.copied { background: var(--accent-dim); color: var(--accent); }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .history-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .history-item:first-child .history-dot {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  .history-date { font-family: 'DM Mono', monospace; font-size: 13px; }
  .history-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .history-badge { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }

  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<div id="scanOverlay" style="display:none" class="scan-overlay"></div>
<div id="toast" class="toast"></div>

<div class="header">
  <div>
    <div class="header-label">Departure Check</div>
    <div class="header-title">外出チェック</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showView('check', this)">チェック</button>
    <button class="tab" onclick="showView('urls', this)">NFC URL</button>
    <button class="tab" onclick="showView('history', this)">履歴</button>
  </div>
</div>

<div class="main">

  <div id="viewCheck" class="view active">
    <div class="section-title">各タグをかざしてチェック</div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>確認済み</span>
        <span id="progressText" class="count">0 / 5</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div id="checkList"></div>
    <div id="completeBanner" class="complete-banner">
      <div class="complete-emoji">✅</div>
      <div class="complete-title">OK！いってらっしゃい</div>
      <div id="completeTime" class="complete-time"></div>
      <button class="btn-reset" onclick="resetAll()">リセット</button>
    </div>
  </div>

  <div id="viewUrls" class="view">
    <div class="section-title">NFCタグに書き込むURL</div>
    <div id="urlList"></div>
    <div style="font-size:11px; color:var(--muted); margin-top:12px; line-height:1.9">
      ※ NFC Tools アプリでURLを書き込んでください<br>
      ※ コピーボタンでURLをクリップボードにコピーできます
    </div>
  </div>

  <div id="viewHistory" class="view">
    <div class="section-title">記録履歴</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const ITEMS = [
  { id: 'door',   icon: '🔒', label: 'ドア（鍵）' },
  { id: 'pass1',  icon: '🪪', label: '入館証①' },
  { id: 'pass2',  icon: '🪪', label: '入館証②' },
  { id: 'gas',    icon: '🔥', label: 'ガス' },
  { id: 'window', icon: '🪟', label: '窓' },
];

const BASE_URL = location.origin + location.pathname;

let checked = {};
let justChecked = null;
let history = [];
let toastTimer = null;

function loadData() {
  try {
    const raw = localStorage.getItem('dep-check-v2');
    if (raw) {
      const d = JSON.parse(raw);
      checked = d.checked || {};
      history = d.history || [];
    }
  } catch {}
}

function saveData() {
  try {
    localStorage.setItem('dep-check-v2', JSON.stringify({ checked, history }));
  } catch {}
}

function formatDate(iso) {
  return new Date(iso).toLocaleString('ja-JP', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function getDayLabel(iso) {
  return ['日','月','火','水','木','金','土'][new Date(iso).getDay()] + '曜日';
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function renderChecklist() {
  const el = document.getElementById('checkList');
  el.innerHTML = '';
  ITEMS.forEach(item => {
    const isChecked = !!checked[item.id];
    const isJust = justChecked === item.id;
    const div = document.createElement('div');
    div.className = 'check-item' + (isChecked ? ' checked' : '') + (isJust ? ' just-checked' : '');
    div.innerHTML = `
      <span class="check-icon">${item.icon}</span>
      <span class="check-label">${item.label}</span>
      <span class="nfc-tag">NFC</span>
      <div class="check-circle">${isChecked ? '✓' : ''}</div>
    `;
    el.appendChild(div);
  });

  const count = ITEMS.filter(i => checked[i.id]).length;
  const all = count === ITEMS.length;

  const pt = document.getElementById('progressText');
  pt.textContent = `${count} / ${ITEMS.length}`;
  pt.className = 'count' + (all ? ' all' : '');

  const fill = document.getElementById('progressFill');
  fill.style.width = `${(count / ITEMS.length) * 100}%`;
  fill.className = 'progress-fill' + (all ? ' all' : '');

  const banner = document.getElementById('completeBanner');
  if (all) {
    banner.classList.add('show');
    document.getElementById('completeTime').textContent = formatDate(new Date().toISOString());
  } else {
    banner.classList.remove('show');
  }
}

function renderURLs() {
  const el = document.getElementById('urlList');
  el.innerHTML = '';
  ITEMS.forEach(item => {
    const url = `${BASE_URL}?item=${item.id}`;
    const div = document.createElement('div');
    div.className = 'url-card';
    div.innerHTML = `
      <span class="url-icon">${item.icon}</span>
      <div style="flex:1;min-width:0">
        <div class="url-label">${item.label}</div>
        <div class="url-text">${url}</div>
      </div>
      <button class="btn-copy" data-url="${url}" onclick="copyURL(this)">コピー</button>
    `;
    el.appendChild(div);
  });
}

function copyURL(btn) {
  const url = btn.dataset.url;
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'コピー';
      btn.classList.remove('copied');
    }, 1500);
  });
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (history.length === 0) {
    el.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  el.innerHTML = '';
  history.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="history-dot"></div>
      <div>
        <div class="history-date">${formatDate(entry.date)}</div>
        <div class="history-sub">${getDayLabel(entry.date)} · 全項目確認済み</div>
      </div>
      <div class="history-badge">✓ OK</div>
    `;
    el.appendChild(div);
  });
}

function resetAll() {
  checked = {};
  justChecked = null;
  saveData();
  renderChecklist();
}

function showView(v, btn) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1)).classList.add('active');
  if (btn) btn.classList.add('active');
  if (v === 'history') renderHistory();
  if (v === 'urls') renderURLs();
}

function checkNFCParam() {
  const params = new URLSearchParams(window.location.search);
  const itemId = params.get('item');

  if (itemId && ITEMS.find(i => i.id === itemId)) {
    const overlay = document.getElementById('scanOverlay');
    overlay.style.display = 'block';
    setTimeout(() => overlay.style.display = 'none', 1000);

    const item = ITEMS.find(i => i.id === itemId);
    checked[itemId] = true;
    justChecked = itemId;
    saveData();

    showToast(`${item.icon} ${item.label} ✓`);

    const allDone = ITEMS.every(i => checked[i.id]);
    if (allDone) {
      history.unshift({ date: new Date().toISOString() });
      if (history.length > 90) history = history.slice(0, 90);
      saveData();
    }

    const url = new URL(window.location);
    url.searchParams.delete('item');
    window.history.replaceState({}, '', url);
  }
}

loadData();
checkNFCParam();
renderChecklist();
</script>
</body>
</html>
